<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Initiatives Gantt Chart</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const GanttChart = () => {
          const [showLegend, setShowLegend] = useState(true);
          const [showDependencies, setShowDependencies] = useState(true);
          const [hoveredInit, setHoveredInit] = useState(null);

          const parseTimePeriod = (time) => {
            if (!time) return [];
            const quarters = [];
            
            if (time.includes('Q1')) quarters.push('Q1');
            if (time.includes('Q2')) quarters.push('Q2');
            if (time.includes('Q3')) quarters.push('Q3');
            if (time.includes('Q4')) quarters.push('Q4');
            
            if (time.includes('Q1-Q2') || time.includes('Q1–Q2')) quarters.push('Q1', 'Q2');
            if (time.includes('Q1-Q4') || time.includes('Q1–Q4')) quarters.push('Q1', 'Q2', 'Q3', 'Q4');
            if (time.includes('Q2-Q4') || time.includes('Q2–Q4')) quarters.push('Q2', 'Q3', 'Q4');
            if (time.includes('Q3-Q4') || time.includes('Q3–Q4')) quarters.push('Q3', 'Q4');
            
            return [...new Set(quarters)];
          };

          const initiatives = [
            // P1 Hero
            { id: 'gtm10-brand', area: 'P1 Hero', name: 'GTM10 Brand Campaign (Phase 1)', time: 'Q2 (Mar–Jun)', type: 'BA', reach: 'High', impact: 'Med', confidence: 'High', effort: 'High', status: 'Planned', feeds: ['gtm10-nurture', 'sales-stories', 'sales-assets', 'content-collabs', 'podcast'] },
            { id: 'gtm10-nurture', area: 'P1 Hero', name: 'GTM10 Post-Nurture (Phase 2)', time: 'Q3 (Jul–Aug)', type: 'N/LG', reach: 'Low', impact: 'Med', confidence: 'High', effort: 'Low', status: 'Planned', feeds: ['newsletter-pm'] },
            { id: 'gtm10-dinners', area: 'P1 Hero', name: 'GTM10 Dinners', time: 'Q3 (Sep)', type: 'LG/BA', reach: 'Low', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', feeds: ['sales-stories', 'user-advocacy', 'content-collabs'] },
            { id: 'hackathons', area: 'P1 Hero', name: 'Lovable Hackathons', time: 'Q3/Q4', type: 'BA/LG', reach: 'High', impact: 'Med', confidence: 'Low', effort: 'Med', status: 'TBD', feeds: ['user-advocacy', 'content-collabs', 'backlinks'] },
            { id: 'series-a', area: 'P1 Hero', name: 'Series A Fundraising Announcement', time: 'Q3 (Jul)', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'High', effort: 'Med', status: 'TBD', feeds: ['newsletter-pm', 'founder-content', 'podcast', 'backlinks'] },
            { id: 'self-serve', area: 'P1 Hero', name: 'Self-Serve Launch / Product Hunt', time: 'Q2 (Apr - May)', type: 'LG/BA', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['feature-pages', 'newsletter-pm', 'founder-content'] },
            { id: 'lovable-integration', area: 'P1 Hero', name: 'Lovable Integration', time: 'Q2 (Apr - May)', type: 'LG/BA', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['feature-pages', 'sales-assets', 'content-collabs'] },
            
            // P2 PM
            { id: 'newsletter-pm', area: 'P2 PM', name: 'Product Marketing Newsletter', time: 'Q1 (Feb) - Q4', type: 'N/LG', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['intent-nurture', 'customer-advocacy'] },
            { id: 'feature-pages', area: 'P2 PM', name: 'Feature Pages System', time: 'Q1–Q2', type: 'LG/N', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['seo', 'google-ads', 'linkedin-ads'] },
            { id: 'website-overhaul', area: 'P2 PM', name: 'Website Overhaul + Flexible CMS', time: 'Q3-Q4', type: 'LG/N', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'High', status: 'TBD', feeds: ['feature-pages', 'seo'] },
            
            // P3 Sales Enablement
            { id: 'signup-flow', area: 'P3 Sales', name: 'Optimizing sign-up form & flow', time: 'Q1 (Jan)', type: 'LG', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'In Preparation', feeds: ['automation'] },
            { id: 'pitch-deck', area: 'P3 Sales', name: 'Revamp pitch deck', time: 'Q1 (Feb)', type: 'LG', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', feeds: ['sales-stories'] },
            { id: 'competitor-library', area: 'P3 Sales', name: 'Competitor Comparison Library', time: 'Q1–Q4', type: 'LG', reach: 'Low', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['sales-assets', 'feature-pages'] },
            { id: 'sales-stories', area: 'P3 Sales', name: 'Success Stories + Logos Pack', time: 'Q1–Q4', type: 'LG/BA', reach: 'Low', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', feeds: ['sales-assets', 'linkedin-ads', 'google-ads'] },
            { id: 'sales-assets', area: 'P3 Sales', name: 'Implementation / Migration Assets / Blogs', time: 'Q1–Q4', type: 'LG', reach: 'Low', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', feeds: ['webinars', 'intent-nurture'] },
            { id: 'intent-nurture', area: 'P3 Sales', name: 'Intent-based Nurture (Exit intent + sequences)', time: 'Q1–Q4 (Feb onwards)', type: 'N/LG', reach: 'Med', impact: 'High', confidence: 'Low', effort: 'Low', status: 'Planned', feeds: ['automation', 'webinars'] },
            { id: 'webinars', area: 'P3 Sales', name: 'Webinars (Monthly)', time: 'Q2–Q4', type: 'LG/N', reach: 'Low', impact: 'High', confidence: 'Med', effort: 'High', status: 'TBD', feeds: ['content-collabs', 'intent-nurture'] },
            
            // P4 WoM / Influencer
            { id: 'customer-advocacy', area: 'P4 WoM', name: 'Customer Advocacy Engine', time: 'Q1–Q4', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['sales-stories', 'linkedin-ads', 'content-collabs'] },
            { id: 'user-advocacy', area: 'P4 WoM', name: 'User Advocacy Engine', time: 'Q1–Q4', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['backlinks', 'founder-content', 'micro-influencer'] },
            { id: 'podcast', area: 'P4 WoM', name: '3rd-Party Podcast Appearances', time: 'Q2–Q4', type: 'BA', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', feeds: ['backlinks', 'peer-recs'] },
            { id: 'amplify-ccl', area: 'P4 WoM', name: 'Amplify CCL', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', feeds: ['user-advocacy', 'content-collabs'] },
            { id: 'peer-recs', area: 'P4 WoM', name: 'Push peer recommendations', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', feeds: ['customer-advocacy', 'sales-stories'] },
            { id: 'micro-influencer', area: 'P4 WoM', name: 'Micro-Influencer Program (Paid Content)', time: 'Q2-Q4', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['backlinks', 'user-advocacy'] },
            
            // P5 GEO
            { id: 'geo-refresh', area: 'P5 GEO', name: 'GEO Refresh Loop', time: 'Q1–Q4', type: 'LG/N', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', feeds: ['feature-pages', 'google-ads'] },
            { id: 'backlinks', area: 'P5 GEO', name: 'Offsite Authority + Backlinks', time: 'Q1–Q4', type: 'LG', reach: 'Med', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['seo', 'geo-refresh'] },
            { id: 'seo', area: 'P5 GEO', name: 'SEO Housekeeping', time: 'Q1–Q4', type: 'LG', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', feeds: ['google-ads'] },
            
            // P6 CLG
            { id: 'content-collabs', area: 'P6 CLG', name: 'Content Collabs (High-bar)', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['backlinks', 'newsletter-curation', 'linkedin-ads'] },
            { id: 'founder-content', area: 'P6 CLG', name: 'Stefan Founder Content Flywheel', time: 'Q1–Q4', type: 'BA', reach: 'High', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', feeds: ['newsletter-curation', 'backlinks', 'linkedin-ads'] },
            { id: 'team-profiles', area: 'P6 CLG', name: 'Team Profiles + Posting System', time: 'Q1 (Feb) –Q4', type: 'BA', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', feeds: ['founder-content', 'linkedin-ads'] },
            { id: 'newsletter-curation', area: 'P6 CLG', name: 'Newsletter (Curation)', time: 'Q2–Q4', type: 'N', reach: 'Med', impact: 'Low', confidence: 'Low', effort: 'Low', status: 'TBD', feeds: ['intent-nurture'] },
            
            // P7 Performance
            { id: 'google-ads', area: 'P7 Performance', name: 'Google Ads (High intent)', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'Med', confidence: 'High', effort: 'Low', status: 'Planned', feeds: ['automation'] },
            { id: 'linkedin-ads', area: 'P7 Performance', name: 'LinkedIn Ads (Mid-funnel)', time: 'TBD', type: 'LG/BA', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'TBD', feeds: ['automation'] },
            
            // Ops
            { id: 'automation', area: 'Ops', name: 'Automation Experiments', time: 'Q1–Q4', type: 'N', reach: 'Low', impact: 'High', confidence: 'Med', effort: 'Low', status: 'TBD', feeds: [] },
          ];

          // Calculate RICE score
          const calculateRICE = (init) => {
            const reachScore = { 'High': 3, 'Med': 2, 'Low': 1 };
            const impactScore = { 'High': 3, 'Med': 2, 'Low': 1 };
            const confidenceScore = { 'High': 1, 'Med': 0.8, 'Low': 0.5 };
            const effortScore = { 'High': 3, 'Med': 2, 'Low': 1 };
            
            const r = reachScore[init.reach] || 1;
            const i = impactScore[init.impact] || 1;
            const c = confidenceScore[init.confidence] || 0.5;
            const e = effortScore[init.effort] || 1;
            
            return ((r * i * c) / e).toFixed(1);
          };

          // Group by area and maintain order
          const areaOrder = ['P1 Hero', 'P2 PM', 'P3 Sales', 'P4 WoM', 'P5 GEO', 'P6 CLG', 'P7 Performance', 'Ops'];
          const groupedInitiatives = {};
          
          areaOrder.forEach(area => {
            groupedInitiatives[area] = initiatives.filter(init => init.area === area);
          });

          const quarters = ['Q1', 'Q2', 'Q3', 'Q4'];
          
          const getStatusColor = (status) => {
            if (status === 'In Preparation') return 'bg-orange-200 border-orange-400';
            if (status === 'TBD') return 'bg-red-100 border-red-300';
            return 'bg-purple-200 border-purple-400';
          };

          const renderBar = (init, status) => {
            const activeQuarters = parseTimePeriod(init.time);
            const color = getStatusColor(status);
            const isHovered = hoveredInit === init.id;
            const feedsThis = initiatives.filter(i => i.feeds.includes(init.id));
            const isFedBy = feedsThis.length > 0;
            const feedsOthers = init.feeds.length > 0;
            const riceScore = calculateRICE(init);
            
            return React.createElement('div', { className: "grid grid-cols-4 gap-1 flex-1" },
              quarters.map((q, idx) =>
                React.createElement('div', { key: q, className: "relative h-10 border-l border-gray-200" },
                  activeQuarters.includes(q) && React.createElement('div', {
                    className: `absolute inset-0 m-0.5 ${color} border rounded transition-all ${isHovered ? 'ring-2 ring-blue-500' : ''} flex items-center justify-center`
                  },
                    React.createElement('span', { className: "text-xs font-semibold text-gray-700" }, riceScore),
                    showDependencies && feedsOthers && React.createElement('div', {
                      className: "absolute -right-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-green-500 rounded-full border border-white",
                      title: "Feeds other initiatives"
                    }),
                    showDependencies && isFedBy && React.createElement('div', {
                      className: "absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-blue-500 rounded-full border border-white",
                      title: "Fed by other initiatives"
                    })
                  )
                )
              )
            );
          };

          return React.createElement('div', { className: "w-full h-full bg-white p-6 overflow-auto" },
            React.createElement('div', { className: "mb-6" },
              React.createElement('h1', { className: "text-2xl font-bold text-gray-800 mb-4" }, "Marketing Initiatives Gantt Chart"),
              React.createElement('div', { className: "flex gap-2 mb-4" },
                React.createElement('button', {
                  onClick: () => setShowDependencies(!showDependencies),
                  className: "px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm"
                }, showDependencies ? 'Hide' : 'Show', ' Dependencies')
              ),
              showLegend && React.createElement('div', { className: "mb-4 p-4 bg-gray-50 rounded space-y-3" },
                React.createElement('div', { className: "flex gap-4 flex-wrap" },
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('div', { className: "w-12 h-6 bg-purple-200 border border-purple-400 rounded" }),
                    React.createElement('span', { className: "text-sm" }, "Planned/Delivery")
                  ),
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('div', { className: "w-12 h-6 bg-orange-200 border border-orange-400 rounded" }),
                    React.createElement('span', { className: "text-sm" }, "In Preparation")
                  ),
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('div', { className: "w-12 h-6 bg-red-100 border border-red-300 rounded" }),
                    React.createElement('span', { className: "text-sm" }, "TBD")
                  )
                ),
                React.createElement('div', { className: "flex gap-4 flex-wrap pt-2 border-t" },
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('span', { className: "text-sm font-semibold" }, "LG"),
                    React.createElement('span', { className: "text-sm" }, "= Lead Gen")
                  ),
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('span', { className: "text-sm font-semibold" }, "BA"),
                    React.createElement('span', { className: "text-sm" }, "= Brand Awareness")
                  ),
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('span', { className: "text-sm font-semibold" }, "N"),
                    React.createElement('span', { className: "text-sm" }, "= Nurturing")
                  ),
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('span', { className: "text-sm font-semibold" }, "RICE Score"),
                    React.createElement('span', { className: "text-sm" }, "= (Reach × Impact × Confidence) / Effort")
                  )
                ),
                showDependencies && React.createElement('div', { className: "flex gap-4 pt-2 border-t" },
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('div', { className: "w-3 h-3 bg-green-500 rounded-full border border-white" }),
                    React.createElement('span', { className: "text-sm" }, "Feeds other initiatives (outputs)")
                  ),
                  React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('div', { className: "w-3 h-3 bg-blue-500 rounded-full border border-white" }),
                    React.createElement('span', { className: "text-sm" }, "Fed by other initiatives (inputs)")
                  )
                )
              )
            ),
            React.createElement('div', { className: "flex gap-2 mb-2 sticky top-0 bg-white z-10 pb-2" },
              React.createElement('div', { className: "w-96 font-semibold text-sm text-gray-700" }, "Initiative"),
              React.createElement('div', { className: "grid grid-cols-4 gap-1 flex-1" },
                quarters.map(q =>
                  React.createElement('div', { key: q, className: "text-center font-semibold text-gray-700 border-l border-gray-300 py-2" }, q)
                )
              )
            ),
            Object.entries(groupedInitiatives).map(([area, items]) =>
              items.length > 0 && React.createElement('div', { key: area, className: "mb-6" },
                React.createElement('div', { className: "font-bold text-sm text-gray-800 mb-2 bg-gray-100 p-2 rounded" }, area),
                items.map((init, idx) => {
                  const feedsThis = initiatives.filter(i => i.feeds.includes(init.id));
                  const feedsCount = init.feeds.length;
                  const isHovered = hoveredInit === init.id;
                  
                  return React.createElement('div', {
                    key: idx,
                    className: `flex gap-2 mb-1 py-1 transition-all ${isHovered ? 'bg-blue-50 border-l-4 border-blue-400' : 'hover:bg-gray-50'}`,
                    onMouseEnter: () => setHoveredInit(init.id),
                    onMouseLeave: () => setHoveredInit(null)
                  },
                    React.createElement('div', { className: "w-96 text-sm text-gray-700 flex items-center gap-2" },
                      React.createElement('span', { className: "truncate flex-1", title: init.name }, init.name),
                      React.createElement('span', { className: "text-xs font-semibold text-blue-600 flex-shrink-0" }, init.type),
                      showDependencies && (feedsCount > 0 || feedsThis.length > 0) && React.createElement('span', { className: "text-xs text-gray-500 flex-shrink-0" },
                        feedsThis.length > 0 && `←${feedsThis.length}`,
                        feedsCount > 0 && ` →${feedsCount}`
                      )
                    ),
                    renderBar(init, init.status)
                  );
                })
              )
            ),
            showDependencies && hoveredInit && (() => {
              const current = initiatives.find(i => i.id === hoveredInit);
              const feedsThis = initiatives.filter(i => i.feeds.includes(hoveredInit));
              const feedsOthers = initiatives.filter(i => current.feeds.includes(i.id));
              const riceScore = calculateRICE(current);
              
              return React.createElement('div', { className: "fixed bottom-4 right-4 bg-white border-2 border-blue-400 rounded-lg shadow-xl p-4 max-w-md z-20" },
                React.createElement('h3', { className: "font-bold text-sm mb-2 text-gray-800" }, current.name),
                React.createElement('div', { className: "mb-2 text-xs" },
                  React.createElement('span', { className: "font-semibold" }, "Type: "), current.type, " | ",
                  React.createElement('span', { className: "font-semibold" }, " RICE: "), riceScore, " | ",
                  React.createElement('span', { className: "font-semibold" }, " R: "), current.reach, " | ",
                  React.createElement('span', { className: "font-semibold" }, " I: "), current.impact, " | ",
                  React.createElement('span', { className: "font-semibold" }, " C: "), current.confidence, " | ",
                  React.createElement('span', { className: "font-semibold" }, " E: "), current.effort
                ),
                feedsThis.length > 0 && React.createElement('div', { className: "mb-2" },
                  React.createElement('p', { className: "text-xs font-semibold text-blue-600 mb-1" }, "📥 Fed by (", feedsThis.length, "):"),
                  React.createElement('ul', { className: "text-xs text-gray-600 space-y-0.5 pl-2" },
                    feedsThis.map(i => React.createElement('li', { key: i.id }, "• ", i.name))
                  )
                ),
                feedsOthers.length > 0 && React.createElement('div', null,
                  React.createElement('p', { className: "text-xs font-semibold text-green-600 mb-1" }, "📤 Feeds (", feedsOthers.length, "):"),
                  React.createElement('ul', { className: "text-xs text-gray-600 space-y-0.5 pl-2" },
                    feedsOthers.map(i => React.createElement('li', { key: i.id }, "• ", i.name))
                  )
                )
              );
            })()
          );
        };

        ReactDOM.render(React.createElement(GanttChart), document.getElementById('root'));
    </script>
</body>
</html>
