<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Initiatives Gantt Chart</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #root { width: 100vw; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const GanttChart = () => {
          const [showLegend, setShowLegend] = useState(true);
          const [showDependencies, setShowDependencies] = useState(true);
          const [hoveredInit, setHoveredInit] = useState(null);
          const [hideTBD, setHideTBD] = useState(false);

          const parseTimePeriod = (time) => {
            if (!time) return [];
            const quarters = [];
            
            if (time.includes('Q1')) quarters.push('Q1');
            if (time.includes('Q2')) quarters.push('Q2');
            if (time.includes('Q3')) quarters.push('Q3');
            if (time.includes('Q4')) quarters.push('Q4');
            
            if (time.includes('Q1-Q2') || time.includes('Q1–Q2')) { quarters.push('Q1', 'Q2'); }
            if (time.includes('Q1-Q4') || time.includes('Q1–Q4')) { quarters.push('Q1', 'Q2', 'Q3', 'Q4'); }
            if (time.includes('Q2-Q4') || time.includes('Q2–Q4')) { quarters.push('Q2', 'Q3', 'Q4'); }
            if (time.includes('Q3-Q4') || time.includes('Q3–Q4')) { quarters.push('Q3', 'Q4'); }
            
            return [...new Set(quarters)];
          };

          const calculateRICE = (reach, impact, confidence, effort) => {
            const reachMap = { 'High': 3, 'Med': 2, 'Low': 1 };
            const impactMap = { 'High': 3, 'Med': 2, 'Low': 1 };
            const confidenceMap = { 'High': 1.0, 'Med': 0.8, 'Low': 0.5 };
            const effortMap = { 'High': 3, 'Med': 2, 'Low': 1 };
            
            const r = reachMap[reach] || 1;
            const i = impactMap[impact] || 1;
            const c = confidenceMap[confidence] || 0.5;
            const e = effortMap[effort] || 1;
            
            return ((r * i * c) / e).toFixed(1);
          };

          const initiatives = [
            // P1 Hero
            { id: 'gtm10-brand', area: 'P1 Hero', name: 'GTM10 Brand Campaign (Phase 1)', time: 'Q2 (Mar-Jun)', type: 'BA', reach: 'High', impact: 'Med', confidence: 'High', effort: 'High', status: 'In Preparation', owner: 'Prachi Rairikar', feeds: ['gtm10-nurture', 'series-a'] },
            { id: 'gtm10-nurture', area: 'P1 Hero', name: 'GTM10 Post-Nurture (Phase 2)', time: 'Q3 (Jul-Aug)', type: 'N/LG', reach: 'Low', impact: 'Med', confidence: 'High', effort: 'Low', status: 'Planned', owner: 'Prachi Rairikar', feeds: [] },
            { id: 'gtm10-dinners', area: 'P1 Hero', name: 'GTM10 Dinners', time: 'Q3 (Sep)', type: 'LG/BA', reach: 'Low', impact: 'High', confidence: 'High', effort: 'High', status: 'Planned', owner: 'Prachi Rairikar', feeds: [] },
            { id: 'hackathons', area: 'P1 Hero', name: 'Lovable Hackathons', time: 'Q3/Q4', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'Low', effort: 'Med', status: 'TBD', owner: 'Prachi Rairikar', feeds: ['founder-content'] },
            { id: 'series-a', area: 'P1 Hero', name: 'Series A Fundraising Announcement', time: 'Q3 (July)', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: ['newsletter-pm', 'founder-content'] },
            { id: 'self-serve', area: 'P1 Hero', name: 'Self-Serve Launch', time: 'Q2 (Apr - May)', type: 'LG/BA', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: ['feature-pages', 'newsletter-pm', 'founder-content'] },
            { id: 'lovable-integration', area: 'P1 Hero', name: 'Lovable Integration', time: 'Q2 (Apr - May)', type: 'LG/BA', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: ['newsletter-pm'] },
            
            // P2 PM
            { id: 'newsletter-pm', area: 'P2 PM', name: 'Product Marketing Newsletter', time: 'Q1 (Feb) - Q4', type: 'N/LG', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: [] },
            { id: 'feature-pages', area: 'P2 PM', name: 'Feature Pages System', time: 'Q1–Q2', type: 'LG/N', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: ['geo-refresh'] },
            { id: 'website-overhaul', area: 'P2 PM', name: 'Website Overhaul + Flexible CMS', time: 'Q3-Q4', type: 'LG/N', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'High', status: 'TBD', owner: 'Philipp Neusser', feeds: [] },
            
            // P3 Sales Enablement
            { id: 'signup-flow', area: 'P3 Sales', name: 'Optimizing our sign-up form & flow', time: 'Q1 (Jan)', type: 'LG', reach: 'Low', impact: 'Med', confidence: 'Low', effort: 'Low', status: 'In Preparation', owner: 'Philipp Neusser', feeds: [] },
            { id: 'pitch-deck', area: 'P3 Sales', name: 'Revamp our pitch deck', time: 'Q1 (Feb)', type: 'LG', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', owner: 'Philipp Neusser', feeds: [] },
            { id: 'competitor-lib', area: 'P3 Sales', name: 'Competitor Comparison Library', time: 'Q1–Q4', type: 'LG', reach: 'Low', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: ['sales-assets'] },
            { id: 'success-stories', area: 'P3 Sales', name: 'Success Stories + Logos Pack', time: 'Q1–Q4', type: 'LG/BA', reach: 'Low', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: ['webinars'] },
            { id: 'sales-assets', area: 'P3 Sales', name: 'Implementation / Migration Assets / Blogs', time: 'Q1–Q4', type: 'LG', reach: 'Low', impact: 'High', confidence: 'High', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: ['webinars', 'intent-nurture'] },
            { id: 'intent-nurture', area: 'P3 Sales', name: 'Intent-based Nurture (Exit intent + sequence)', time: 'Q1–Q4 (Feb onwards)', type: 'N/LG', reach: 'Med', impact: 'High', confidence: 'Low', effort: 'Low', status: 'Ongoing', owner: 'Julia Kleber', feeds: [] },
            { id: 'webinars', area: 'P3 Sales', name: 'Webinars (Monthly)', time: 'Q2–Q4', type: 'LG/N', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'High', status: 'TBD', owner: 'Philipp Neusser', feeds: [] },
            
            // P4 WoM / Influencer
            { id: 'customer-advocacy', area: 'P4 WoM', name: 'Customer Advocacy Engine', time: 'Q1–Q4', type: 'BA/LG', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'TBD', owner: 'Prerna Kaushik', feeds: ['success-stories'] },
            { id: 'user-advocacy', area: 'P4 WoM', name: 'User Advocacy Engine', time: 'Q1–Q4', type: 'BA/LG', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: [] },
            { id: 'podcasts', area: 'P4 WoM', name: '3rd-Party Podcast Appearances', time: 'Q2–Q4', type: 'BA', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', owner: 'Prachi Rairikar', feeds: [] },
            { id: 'amplify-ccl', area: 'P4 WoM', name: 'Amplify CCL', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: [] },
            { id: 'peer-recs', area: 'P4 WoM', name: 'Push peer recommendations', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'High', confidence: 'Med', effort: 'High', status: 'Planned', owner: 'Philipp Neusser', feeds: [] },
            { id: 'micro-influencer', area: 'P4 WoM', name: 'Micro-Influencer Program (Paid Content)', time: 'Q3-Q4', type: 'BA/LG', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Philipp Neusser', feeds: [] },
            
            // P5 GEO
            { id: 'geo-refresh', area: 'P5 GEO', name: 'GEO Refresh Loop', time: 'Q1–Q4', type: 'LG/N', reach: 'Med', impact: 'Med', confidence: 'Low', effort: 'Low', status: 'Planned', owner: 'Prerna Kaushik', feeds: [] },
            { id: 'offsite-authority', area: 'P5 GEO', name: 'Offsite Authority + Backlinks', time: 'Q1–Q4', type: 'LG', reach: 'Med', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: [] },
            { id: 'seo-housekeeping', area: 'P5 GEO', name: 'SEO Housekeeping', time: 'Q1–Q4', type: 'LG', reach: 'Low', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'Planned', owner: 'Prerna Kaushik', feeds: [] },
            
            // P6 CLG
            { id: 'content-collabs', area: 'P6 CLG', name: 'Content Collabs (High-bar)', time: 'Q1–Q4', type: 'LG', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'TBD', owner: 'Philipp Neusser', feeds: [] },
            { id: 'founder-content', area: 'P6 CLG', name: 'Stefan Founder Content Flywheel', time: 'Q1–Q4', type: 'BA', reach: 'High', impact: 'High', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: [] },
            { id: 'team-profiles', area: 'P6 CLG', name: 'Team Profiles + Posting System', time: 'Q1 (Feb) –Q4', type: 'BA', reach: 'Med', impact: 'Med', confidence: 'Med', effort: 'Med', status: 'Planned', owner: 'Prerna Kaushik', feeds: [] },
            { id: 'newsletter-curation', area: 'P6 CLG', name: 'Newsletter (Curation)', time: 'Q2–Q4', type: 'N', reach: 'Med', impact: 'Low', confidence: 'Low', effort: 'Low', status: 'TBD', owner: 'Prerna Kaushik', feeds: [] },
            
            // P7 Performance
            { id: 'google-ads', area: 'P7 Perf', name: 'Google Ads (High intent)', time: 'TBD (post baseline)', type: 'LG', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'TBD', owner: '', feeds: [] },
            { id: 'linkedin-ads', area: 'P7 Perf', name: 'LinkedIn Ads (Mid-funnel)', time: 'TBD (post baseline)', type: 'BA', reach: 'High', impact: 'Med', confidence: 'Med', effort: 'Low', status: 'TBD', owner: '', feeds: [] },
            
            // Ops
            { id: 'automation', area: 'Ops', name: 'Automation Experiments', time: 'Q1–Q4', type: 'N', reach: 'Low', impact: 'High', confidence: 'Low', effort: 'Low', status: 'TBD', owner: 'Prerna Kaushik', feeds: [] },
          ];

          const quarters = ['Q1', 'Q2', 'Q3', 'Q4'];
          
          const getStatusColor = (status) => {
            switch(status) {
              case 'In Preparation': return 'bg-orange-500';
              case 'Ongoing': return 'bg-green-500';
              case 'Planned': return 'bg-blue-500';
              case 'TBD': return 'bg-gray-400';
              default: return 'bg-gray-400';
            }
          };

          const getTypeColors = (type) => {
            if (type.includes('BA') && type.includes('LG')) return 'bg-gradient-to-r from-purple-500 to-blue-500';
            if (type.includes('N') && type.includes('LG')) return 'bg-gradient-to-r from-green-500 to-blue-500';
            if (type.includes('BA')) return 'bg-purple-500';
            if (type.includes('LG')) return 'bg-blue-500';
            if (type.includes('N')) return 'bg-green-500';
            return 'bg-gray-400';
          };

          const renderBar = (init, status) => {
            const activeQuarters = parseTimePeriod(init.time);
            const rice = calculateRICE(init.reach, init.impact, init.confidence, init.effort);
            
            return quarters.map((q, idx) => {
              const isActive = activeQuarters.includes(q);
              const isFirst = isActive && (idx === 0 || !activeQuarters.includes(quarters[idx - 1]));
              const isLast = isActive && (idx === quarters.length - 1 || !activeQuarters.includes(quarters[idx + 1]));
              const isSingle = isFirst && isLast;
              const midIdx = Math.floor((activeQuarters.indexOf(activeQuarters[0]) + activeQuarters.indexOf(activeQuarters[activeQuarters.length - 1])) / 2);
              const showScore = isActive && quarters.indexOf(q) === quarters.indexOf(activeQuarters[Math.floor(activeQuarters.length / 2)]);
              
              return (
                <div key={q} className="w-24 h-8 px-1 flex items-center">
                  {isActive ? (
                    <div 
                      className={`h-6 w-full ${getTypeColors(init.type)} ${
                        isSingle ? 'rounded-md' : isFirst ? 'rounded-l-md' : isLast ? 'rounded-r-md' : ''
                      } flex items-center justify-center shadow-sm`}
                    >
                      {showScore && (
                        <span className="text-white text-xs font-bold drop-shadow">{rice}</span>
                      )}
                    </div>
                  ) : (
                    <div className="h-6 w-full"></div>
                  )}
                </div>
              );
            });
          };

          const areas = [...new Set(initiatives.map(i => i.area))];
          
          const filteredInitiatives = hideTBD 
            ? initiatives.filter(i => i.status !== 'TBD')
            : initiatives;

          return (
            <div className="p-6 bg-gray-50 min-h-screen">
              <div className="max-w-7xl mx-auto">
                <h1 className="text-2xl font-bold text-gray-800 mb-4">Marketing Initiatives 2025</h1>
                
                {/* RICE Score Explanation */}
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
                  <h3 className="font-semibold text-blue-800 mb-2">📊 RICE Score Calculation</h3>
                  <div className="text-sm text-blue-700">
                    <p className="mb-2"><strong>RICE = (Reach × Impact × Confidence) / Effort</strong></p>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                      <div><strong>Reach:</strong> High=3, Med=2, Low=1</div>
                      <div><strong>Impact:</strong> High=3, Med=2, Low=1</div>
                      <div><strong>Confidence:</strong> High=100%, Med=80%, Low=50%</div>
                      <div><strong>Effort:</strong> High=3, Med=2, Low=1</div>
                    </div>
                    <p className="mt-2 text-xs">Higher RICE = better ROI. Score of 3.0+ is high priority, 1.5-3.0 is good, below 1.5 may need reconsideration.</p>
                  </div>
                </div>
                
                {/* Controls */}
                <div className="flex flex-wrap gap-4 mb-4">
                  <label className="flex items-center gap-2 text-sm">
                    <input 
                      type="checkbox" 
                      checked={showLegend}
                      onChange={(e) => setShowLegend(e.target.checked)}
                      className="rounded"
                    />
                    Show Legend
                  </label>
                  <label className="flex items-center gap-2 text-sm">
                    <input 
                      type="checkbox" 
                      checked={showDependencies}
                      onChange={(e) => setShowDependencies(e.target.checked)}
                      className="rounded"
                    />
                    Show Dependencies
                  </label>
                  <label className="flex items-center gap-2 text-sm">
                    <input 
                      type="checkbox" 
                      checked={hideTBD}
                      onChange={(e) => setHideTBD(e.target.checked)}
                      className="rounded"
                    />
                    Hide TBD Projects
                  </label>
                </div>
                
                {/* Legend */}
                {showLegend && (
                  <div className="bg-white rounded-lg p-4 mb-4 shadow-sm border">
                    <div className="flex flex-wrap gap-6 text-sm">
                      <div className="flex items-center gap-2">
                        <span className="font-semibold">Type:</span>
                        <span className="flex items-center gap-1"><span className="w-3 h-3 bg-blue-500 rounded"></span> Lead Gen</span>
                        <span className="flex items-center gap-1"><span className="w-3 h-3 bg-purple-500 rounded"></span> Brand Awareness</span>
                        <span className="flex items-center gap-1"><span className="w-3 h-3 bg-green-500 rounded"></span> Nurturing</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="font-semibold">Status:</span>
                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-orange-500 rounded-full"></span> In Preparation</span>
                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full"></span> Ongoing</span>
                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-blue-500 rounded-full"></span> Planned</span>
                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-gray-400 rounded-full"></span> TBD</span>
                      </div>
                    </div>
                  </div>
                )}
                
                {/* Gantt Chart */}
                <div className="bg-white rounded-lg shadow-sm border overflow-x-auto">
                  {/* Header */}
                  <div className="flex border-b bg-gray-100 sticky top-0">
                    <div className="w-64 p-3 font-semibold text-gray-700 border-r flex-shrink-0">Initiative</div>
                    <div className="w-32 p-3 font-semibold text-gray-700 border-r flex-shrink-0">Owner</div>
                    <div className="w-16 p-3 font-semibold text-gray-700 border-r flex-shrink-0 text-center">Status</div>
                    {quarters.map(q => (
                      <div key={q} className="w-24 p-3 font-semibold text-gray-700 text-center flex-shrink-0">{q}</div>
                    ))}
                  </div>
                  
                  {/* Body */}
                  {areas.map(area => {
                    const areaInitiatives = filteredInitiatives.filter(i => i.area === area);
                    if (areaInitiatives.length === 0) return null;
                    
                    return (
                      <div key={area}>
                        <div className="flex bg-gray-50 border-b">
                          <div className="w-full p-2 font-semibold text-gray-600 text-sm">{area}</div>
                        </div>
                        {areaInitiatives.map(init => {
                          const feedsThis = filteredInitiatives.filter(i => i.feeds.includes(init.id));
                          const feedsCount = init.feeds.length;
                          
                          return (
                            <div 
                              key={init.id}
                              className={`flex border-b items-center ${
                                hoveredInit === init.id ? 'bg-blue-50 border-l-4 border-blue-400' : 'hover:bg-gray-50'
                              }`}
                              onMouseEnter={() => setHoveredInit(init.id)}
                              onMouseLeave={() => setHoveredInit(null)}
                            >
                              <div className="w-64 p-2 text-sm text-gray-700 flex items-center gap-2 flex-shrink-0 border-r">
                                <span className="truncate" title={init.name}>{init.name}</span>
                                {showDependencies && (feedsCount > 0 || feedsThis.length > 0) && (
                                  <span className="text-xs text-gray-500 flex-shrink-0">
                                    {feedsThis.length > 0 && `←${feedsThis.length}`}
                                    {feedsCount > 0 && ` →${feedsCount}`}
                                  </span>
                                )}
                              </div>
                              <div className="w-32 p-2 text-xs text-gray-600 flex-shrink-0 border-r truncate" title={init.owner}>
                                {init.owner || '-'}
                              </div>
                              <div className="w-16 p-2 flex-shrink-0 border-r flex justify-center">
                                <span className={`w-3 h-3 rounded-full ${getStatusColor(init.status)}`} title={init.status}></span>
                              </div>
                              {renderBar(init, init.status)}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
                
                {/* Dependency Tooltip */}
                {showDependencies && hoveredInit && (() => {
                  const current = initiatives.find(i => i.id === hoveredInit);
                  const feedsThis = initiatives.filter(i => i.feeds.includes(hoveredInit));
                  const feedsOthers = initiatives.filter(i => current.feeds.includes(i.id));
                  
                  if (feedsThis.length === 0 && feedsOthers.length === 0) return null;
                  
                  return (
                    <div className="fixed bottom-4 right-4 bg-white border-2 border-blue-400 rounded-lg shadow-xl p-4 max-w-md z-20">
                      <h3 className="font-bold text-sm mb-2 text-gray-800">{current.name}</h3>
                      <p className="text-xs text-gray-500 mb-2">Owner: {current.owner || 'TBD'}</p>
                      {feedsThis.length > 0 && (
                        <div className="mb-2">
                          <p className="text-xs font-semibold text-blue-600 mb-1">📥 Fed by ({feedsThis.length}):</p>
                          <ul className="text-xs text-gray-600 space-y-0.5 pl-2">
                            {feedsThis.map(i => <li key={i.id}>• {i.name}</li>)}
                          </ul>
                        </div>
                      )}
                      {feedsOthers.length > 0 && (
                        <div>
                          <p className="text-xs font-semibold text-green-600 mb-1">📤 Feeds ({feedsOthers.length}):</p>
                          <ul className="text-xs text-gray-600 space-y-0.5 pl-2">
                            {feedsOthers.map(i => <li key={i.id}>• {i.name}</li>)}
                          </ul>
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            </div>
          );
        };

        ReactDOM.render(<GanttChart />, document.getElementById('root'));
    </script>
</body>
</html>
